name: Build & Package Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android-gamepad-app/gradlew

      - name: Build Debug & Release APK
        run: |
          cd android-gamepad-app
          ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CemuPad-Android-Debug
          path: android-gamepad-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CemuPad-Android-Release
          path: android-gamepad-app/app/build/outputs/apk/release/*.apk

  build-cemu:
    name: Build Cemu Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC & CMake
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B Cemu/build -S Cemu -DCMAKE_BUILD_TYPE=Release

      - name: Build Cemu Target
        run: |
          cmake --build Cemu/build --config Release --target CemuBin

      - name: Upload Cemu Executable
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-Streaming-Windows-x64
          path: Cemu/bin/Cemu_release.exe
