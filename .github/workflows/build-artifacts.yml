name: Build & Package Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android-gamepad-app/gradlew

      - name: Build Debug & Release APK
        run: |
          cd android-gamepad-app
          ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CemuPad-Android-Debug
          path: android-gamepad-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CemuPad-Android-Release
          path: android-gamepad-app/app/build/outputs/apk/release/*.apk
